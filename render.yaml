services:
  # FastAPI Web Service
  - type: web
    name: enterprise-rag-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-rag-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSION
        value: 384
      - key: PYTHONPATH
        value: /workspace

databases:
  # PostgreSQL database with pgvector support
  - name: enterprise-rag-db
    databaseName: enterprise_rag
    plan: free
