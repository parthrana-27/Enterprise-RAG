version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: enterprise_rag_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: enterprise_rag_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: enterprise_rag_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_rag
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSION: 384
      SECRET_KEY: super-secret-enterprise-rag-key-2026
    depends_on:
      - db
      - redis
    volumes:
      - uploads_data:/workspace/uploads

volumes:
  postgres_data:
  redis_data:
  uploads_data:
